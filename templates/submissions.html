<!DOCTYPE html>
<html>
<head>
    <title>Submissions</title>
</head>
<body>

<h1>Student Submissions</h1>

<table border="1">
<tr>
    <th>ID</th>
    <th>Student</th>
    <th>File</th>
</tr>

{% for s in submissions %}
<tr>
    <td>{{ s[0] }}</td>
    <td>{{ s[2] }}</td>
    <td>{{ s[3] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
